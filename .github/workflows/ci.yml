name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs the exact same config as the local pre-commit install, so CI and a
  # developer machine can never disagree about what passes.
  lint:
    name: pre-commit (gitleaks + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  guards:
    name: Claude guard hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both suites drive scripts that call rg, which the runner image lacks.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Run golden-input tests
        run: bash claude/test-hooks.sh
      # The reconciler edits CLAUDE.md and agent frontmatter, so a suite CI
      # never runs is a suite that rots. It drives a throwaway CLAUDE_DIR and
      # touches nothing outside it.
      - name: Run override tests
        run: bash claude/test-overrides.sh

  installer:
    name: Installer smoke test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Not a full run: install.sh mutates $HOME and ends in `exec zsh`. This
      # only proves every phase script parses and the paths install.sh calls
      # actually exist — the drift that broke the installer before.
      - name: Parse-check every script
        run: |
          for f in install.sh scripts/*.sh claude/*.sh claude/hooks/*.sh claude/gentle-ai-overrides/*.sh; do
            bash -n "$f" || exit 1
          done
      - name: Verify every script install.sh invokes exists
        run: |
          missing=0
          while read -r path; do
            [ -f "$path" ] || { echo "install.sh calls missing script: $path"; missing=1; }
          done < <(grep -oE '\$DOTFILES_DIR/scripts/[a-z_]+\.sh' install.sh | sed 's|\$DOTFILES_DIR/||' | sort -u)
          exit $missing
